<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mud Puddle Dash</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 60%, #6b4423 60%, #6b4423 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 15px;
    color: #3d2817;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 4px;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
  }

  .subtitle {
    font-size: 14px;
    color: #4a2e1a;
    font-weight: 600;
  }

  .game-wrapper {
    background: #2c1810;
    padding: 12px;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  }

  #gameCanvas {
    display: block;
    background: linear-gradient(180deg, #87CEEB 0%, #a3c9a8 70%, #8b7355 70%, #8b7355 100%);
    border-radius: 10px;
    touch-action: none;
  }

  .controls {
    margin-top: 15px;
    text-align: center;
    color: #3d2817;
    font-size: 13px;
    font-weight: 600;
  }

  .score-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 600px;
    color: #3d2817;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 8px;
    padding: 0 5px;
  }

  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .overlay-box {
    background: #fff;
    padding: 35px 40px;
    border-radius: 20px;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  .overlay-box h2 {
    color: #6b4423;
    margin-bottom: 10px;
    font-size: 26px;
  }

  .overlay-box p {
    color: #555;
    margin-bottom: 20px;
    font-size: 15px;
  }

  .overlay-box button {
    background: #ff9800;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .overlay-box button:hover {
    background: #f57c00;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🚶 Mud Puddle Dash 🚧</h1>
  <div class="subtitle">Bamenda roads are rough — jump those potholes and mud puddles!</div>
</div>

<div class="score-row">
  <div>Score: <span id="score">0</span></div>
  <div>Best: <span id="best">0</span></div>
</div>

<div class="game-wrapper">
  <canvas id="gameCanvas" width="600" height="300"></canvas>
</div>

<div class="controls">Tap the game, click, or press SPACE to jump!</div>

<div id="overlay">
  <div class="overlay-box">
    <h2>💦 Splash!</h2>
    <p id="finalScore">You fell into a mud puddle.</p>
    <button onclick="restartGame()">Try Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const groundY = 230;
let gravity = 0.7;
let gameSpeed = 5;
let score = 0;
let best = 0;
let isGameOver = false;
let isStarted = false;

const man = {
  x: 60,
  y: groundY - 40,
  width: 28,
  height: 40,
  vy: 0,
  isJumping: false
};

let obstacles = [];
let frame = 0;
let nextObstacleFrame = 60;

function drawBackground() {
  // sky
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, canvas.width, groundY);

  // distant hills
  ctx.fillStyle = '#7ba672';
  ctx.beginPath();
  ctx.arc(100, groundY, 60, Math.PI, 0);
  ctx.arc(300, groundY, 80, Math.PI, 0);
  ctx.arc(500, groundY, 50, Math.PI, 0);
  ctx.fill();

  // road (dirt)
  ctx.fillStyle = '#8b7355';
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

  // road texture lines
  ctx.strokeStyle = 'rgba(90,60,30,0.4)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    let lineX = (i * 90 - (frame * 2) % 90);
    ctx.beginPath();
    ctx.moveTo(lineX, groundY + 15);
    ctx.lineTo(lineX + 30, groundY + 15);
    ctx.stroke();
  }
}

function drawMan() {
  ctx.save();
  ctx.translate(man.x, man.y);

  // head
  ctx.fillStyle = '#3d2817';
  ctx.beginPath();
  ctx.arc(14, 8, 8, 0, Math.PI * 2);
  ctx.fill();

  // body
  ctx.fillStyle = '#1e5f8a';
  ctx.fillRect(6, 16, 16, 18);

  // legs (simple running animation)
  ctx.strokeStyle = '#2c1810';
  ctx.lineWidth = 4;
  let legOffset = man.isJumping ? 5 : Math.sin(frame * 0.5) * 6;
  ctx.beginPath();
  ctx.moveTo(9, 34);
  ctx.lineTo(9 - legOffset, 42);
  ctx.moveTo(19, 34);
  ctx.lineTo(19 + legOffset, 42);
  ctx.stroke();

  ctx.restore();
}

function spawnObstacle() {
  const isPuddle = Math.random() > 0.4;
  const width = isPuddle ? 50 + Math.random() * 30 : 26;
  obstacles.push({
    x: canvas.width,
    width: width,
    height: isPuddle ? 10 : 30,
    type: isPuddle ? 'puddle' : 'pothole',
    y: isPuddle ? groundY - 5 : groundY - 5
  });
}

function drawObstacles() {
  obstacles.forEach(o => {
    if (o.type === 'puddle') {
      ctx.fillStyle = '#4a3728';
      ctx.beginPath();
      ctx.ellipse(o.x + o.width/2, o.y + 5, o.width/2, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(120,150,180,0.6)';
      ctx.beginPath();
      ctx.ellipse(o.x + o.width/2, o.y + 3, o.width/2 - 5, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#1a1210';
      ctx.beginPath();
      ctx.ellipse(o.x + o.width/2, o.y + 5, o.width/2, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function checkCollision() {
  for (let o of obstacles) {
    const manBottom = man.y + man.height;
    const manLeft = man.x;
    const manRight = man.x + man.width;

    const obLeft = o.x;
    const obRight = o.x + o.width;

    const overlapX = manRight > obLeft + 8 && manLeft < obRight - 8;
    const overlapY = manBottom > o.y - 5;

    if (overlapX && overlapY) {
      return true;
    }
  }
  return false;
}

function update() {
  if (!isStarted || isGameOver) return;

  frame++;

  // physics
  man.vy += gravity;
  man.y += man.vy;

  if (man.y >= groundY - man.height) {
    man.y = groundY - man.height;
    man.vy = 0;
    man.isJumping = false;
  }

  // obstacles
  obstacles.forEach(o => o.x -= gameSpeed);
  obstacles = obstacles.filter(o => o.x + o.width > 0);

  if (frame >= nextObstacleFrame) {
    spawnObstacle();
    nextObstacleFrame = frame + 55 + Math.random() * 40;
  }

  // speed increases with score
  gameSpeed = 5 + Math.floor(score / 10) * 0.5;

  if (checkCollision()) {
    endGame();
    return;
  }

  score++;
  document.getElementById('score').textContent = Math.floor(score / 5);
}

function draw() {
  drawBackground();
  drawObstacles();
  drawMan();
}

function gameLoop() {
  update();
  draw();
  if (!isGameOver) {
    requestAnimationFrame(gameLoop);
  }
}

function jump() {
  if (!isStarted) {
    isStarted = true;
    gameLoop();
    return;
  }
  if (!man.isJumping && !isGameOver) {
    man.vy = -13;
    man.isJumping = true;
  }
}

function endGame() {
  isGameOver = true;
  const finalScore = Math.floor(score / 5);
  if (finalScore > best) {
    best = finalScore;
    document.getElementById('best').textContent = best;
  }
  document.getElementById('finalScore').textContent = `You scored ${finalScore}! The road got you this time.`;
  document.getElementById('overlay').style.display = 'flex';
}

function restartGame() {
  obstacles = [];
  frame = 0;
  score = 0;
  gameSpeed = 5;
  man.y = groundY - man.height;
  man.vy = 0;
  man.isJumping = false;
  isGameOver = false;
  isStarted = true;
  nextObstacleFrame = 60;
  document.getElementById('score').textContent = '0';
  document.getElementById('overlay').style.display = 'none';
  gameLoop();
}

// controls
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  jump();
});

// initial draw
draw();
ctx.fillStyle = 'rgba(0,0,0,0.5)';
ctx.font = 'bold 20px Arial';
ctx.textAlign = 'center';
ctx.fillStyle = '#fff';
ctx.fillText('Click or press SPACE to start!', canvas.width/2, canvas.height/2);
</script>

</body>
</html>
